[package]
name = "desktop"
version = "0.1.0"
description = "MarkUP — editor de documentos desktop"
authors = ["MarkUP"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Watcher de filesystem — não existe plugin oficial do Tauri 2 pra isso
# (confirmado na documentação atual); `notify` é a crate padrão do
# ecossistema Rust, `notify-debouncer-full` cobre a coalescência que antes
# eu tinha que implementar à mão em C# (WorkspaceChangeCoalescer).
notify = "8"
notify-debouncer-full = "0.7"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
