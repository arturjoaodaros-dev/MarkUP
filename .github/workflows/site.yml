name: Publish docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/core/**'
      - 'packages/renderer/**'
      - 'packages/site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build --workspace=packages/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
